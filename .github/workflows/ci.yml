name: CI

on:
  push:
  pull_request:
  # Manual runs also run the mutation harness (slow: every known bug injected, rebuilt and tested).
  workflow_dispatch:

jobs:
  core:
    name: Core build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore CarTuningSim.sln
      - name: Build
        run: dotnet build CarTuningSim.sln --no-restore -c Release
      - name: Test
        run: dotnet test CarTuningSim.sln --no-build -c Release --logger "console;verbosity=normal"
      - name: CLI smoke (content validation and a dyno sweep)
        run: |
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- validate
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- sweep kestrel_k20 --from 2000 --to 7000 --step 1000
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- sweep isar_m54 --fuel gasoline_98 --from 2000 --to 6000 --step 1000
      - name: Agent skills match their sources (tools/agent-skills → .agents/skills, .claude/skills links)
        run: |
          for src in tools/agent-skills/*/; do
            name=$(basename "$src")
            diff -r "$src" ".agents/skills/$name"
            test -f ".claude/skills/$name/SKILL.md"
            grep -q "\"$name\"" skills-lock.json
          done
      - name: CLI smoke (synthetic engine matrix as a content layer)
        run: |
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- validate --mods content/test
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- inspect syn_v8_ohv --mods content/test
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- sweep syn_v6_tt --mods content/test --fuel gasoline_98 --from 2000 --to 7000 --step 1000
      - name: Engine authoring check (check-engine; exit 0 = no errors, 3 = warnings under --strict)
        run: |
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- check-engine kestrel_k20 --strict 1
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- check-engine isar_m54
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- check-engine syn_v6_tt --mods content/test
      - name: Baseline tune generation (generate-tune; exit 0 = generated, 2 = refused) — ENGINE_AUTHORING_GUIDE.md §6b
        run: |
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- generate-tune kestrel_k20 --fuel gasoline_95 --out "$RUNNER_TEMP/k20.json"
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- generate-tune kestrel_k20 --fuel gasoline_95 --out "$RUNNER_TEMP/k20.json" --check 1 | tee gen-check.log
          grep -q "OUTPUT  UNCHANGED" gen-check.log
          # A --manifest that cannot be loaded stops generation with exit 1, never a silent fallback (review P3-001).
          code=0; dotnet run --project tools/CarSim.Cli --no-build -c Release -- generate-tune kestrel_k20 --fuel gasoline_95 --manifest missing-manifest.json || code=$?
          test "$code" -eq 1
      - name: Verification tools (fingerprint from the CLI, tune-regeneration driver) — docs/VERIFICATION.md
        run: |
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- fingerprint --case k20_stock_95,m54_stock_98
          dotnet run --project tools/CarSim.Cli --no-build -c Release -- regenerate-tunes --tune k20.stock,syn.r6.stock

  godot-smoke:
    name: Godot headless smoke test
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download Godot 4.7.2 (.NET)
        run: |
          curl -sSL --fail -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q godot.zip -d godot-bin
          GODOT_BIN=$(find "$PWD/godot-bin" -type f -name 'Godot_v*mono_linux*x86_64' | head -1)
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Build game assembly
        run: dotnet build game/CarTuningSim.csproj
      - name: Import project
        run: timeout 300 "$GODOT_BIN" --headless --path game --import || true
      - name: Smoke test (content, garage, dyno pull)
        run: |
          timeout 300 "$GODOT_BIN" --headless --path game -- --smoke-test | tee smoke.log
          grep -q "SMOKE TEST PASSED" smoke.log
      - name: Drive smoke test (test track, autopilot)
        run: |
          timeout 300 "$GODOT_BIN" --headless --path game -- --drive --smoke-test | tee drive.log
          grep -q "DRIVE SMOKE TEST PASSED" drive.log
      - name: Second engine family through the same game layer (Isar M54 scenario, dyno and drive)
        run: |
          timeout 300 "$GODOT_BIN" --headless --path game -- --smoke-test --scenario=isar_c30_six | tee smoke-m54.log
          grep -q "SMOKE TEST PASSED.*Isar M54" smoke-m54.log
          timeout 300 "$GODOT_BIN" --headless --path game -- --drive --smoke-test --scenario=isar_c30_six | tee drive-m54.log
          grep -q "DRIVE SMOKE TEST PASSED" drive-m54.log
      - name: Synthetic engines through the same game layer (pushrod V8 and twin-turbo V6 swapped into the Isar, dyno and drive)
        env:
          CARSIM_MODS_DIR: ${{ github.workspace }}/content/test
        run: |
          for s in syn_v8_swap syn_v6_tt_swap; do
            timeout 300 "$GODOT_BIN" --headless --path game -- --smoke-test --scenario=$s | tee smoke-$s.log
            grep -q "SMOKE TEST PASSED.*Synth" smoke-$s.log
            if grep -q "ERROR" smoke-$s.log; then echo "script errors in the dyno smoke test"; exit 1; fi
            timeout 300 "$GODOT_BIN" --headless --path game -- --drive --smoke-test --scenario=$s | tee drive-$s.log
            grep -q "DRIVE SMOKE TEST PASSED" drive-$s.log
            if grep -q "ERROR" drive-$s.log; then echo "script errors in the drive smoke test"; exit 1; fi
          done

  mutation-check:
    name: Mutation harness (manual dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject every known bug (tools/CarSim.MutationCheck/mutations.json) and prove its tests fail
        run: dotnet run --project tools/CarSim.MutationCheck -c Release
