name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore CarTuningSim.sln
      - name: Build
        run: dotnet build CarTuningSim.sln --no-restore -c Release
      - name: Test
        run: dotnet test CarTuningSim.sln --no-build -c Release --logger "console;verbosity=normal"
